name: Deploy web app

# Publishes apps/web to GitHub Pages on every push to the repository's default branch, whichever
# branch that is (GitHub Pages accepts deploys only from the default branch).
# Needs "GitHub Actions" as the Pages source (Settings, Pages). To turn it off, set the
# repository variable DEPLOY_PAGES to "false" (Settings, Secrets and variables, Actions).
#
# Automatic checks: with the repository secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# USCIS_CLIENT_ID, and USCIS_CLIENT_SECRET set, the sync server is deployed to Cloudflare first
# and the web app is built with its address (see docs/DEPLOY.md). The variable VITE_SYNC_URL, when
# set, overrides that address. USCIS_BASE_URL (variable) switches the server to production.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One group per branch, so a skipped run on another branch never cancels a deploy.
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  server:
    if: ${{ vars.DEPLOY_PAGES != 'false' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Cloudflare secrets. Skipping the sync server; the app works without it."
          fi
      - if: steps.ready.outputs.on == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.on == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.ready.outputs.on == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.ready.outputs.on == 'true'
        run: pnpm install --frozen-lockfile
      - id: deploy
        if: steps.ready.outputs.on == 'true'
        run: node scripts/deploy-server.mjs
        env:
          USCIS_CLIENT_ID: ${{ secrets.USCIS_CLIENT_ID }}
          USCIS_CLIENT_SECRET: ${{ secrets.USCIS_CLIENT_SECRET }}
          USCIS_BASE_URL: ${{ vars.USCIS_BASE_URL }}
          APP_ORIGINS: ${{ vars.APP_ORIGINS }}
      # Health, CORS for the app, and one sandbox lookup that proves the USCIS keys work.
      - if: steps.deploy.outputs.url != ''
        run: |
          origin="${APP_ORIGINS%%,*}"
          [ -n "$origin" ] || origin="https://${GITHUB_REPOSITORY_OWNER,,}.github.io"
          node scripts/smoke-server.mjs "${{ steps.deploy.outputs.url }}" "$origin"
        env:
          APP_ORIGINS: ${{ vars.APP_ORIGINS }}

  build:
    needs: server
    # Runs when the server job is skipped or fails too: the app works without the server.
    if: ${{ !cancelled() && vars.DEPLOY_PAGES != 'false' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @waymark/web build
        env:
          # Only a server that deployed and passed its check.
          VITE_SYNC_URL: ${{ vars.VITE_SYNC_URL || (needs.server.result == 'success' && needs.server.outputs.url) || '' }}
      - run: pnpm size
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
