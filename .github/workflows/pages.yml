name: Deploy web app

# Publishes apps/web to GitHub Pages on every push to the repository's default branch, whichever
# branch that is (GitHub Pages accepts deploys only from the default branch).
# Needs "GitHub Actions" as the Pages source (Settings, Pages). To turn it off, set the
# repository variable DEPLOY_PAGES to "false" (Settings, Secrets and variables, Actions).
# Optional: set VITE_SYNC_URL to a sync server address to prefill it in the app.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.DEPLOY_PAGES != 'false' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @waymark/web build
        env:
          VITE_SYNC_URL: ${{ vars.VITE_SYNC_URL }}
      - run: pnpm size
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
